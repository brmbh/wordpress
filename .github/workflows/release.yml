# Releases @brmbh/cli — only when started by hand (Actions → release → Run workflow, or
# `gh workflow run release.yml -f bump=patch`). Merging to main never publishes.
#
# Bumps packages/cli/package.json and inc/core/core.json together, tests, publishes to npm
# with trusted publishing (OIDC, no token; provenance attached), then commits the bump to
# main, tags vX.Y.Z and creates the GitHub release with generated notes.
#
# One-time setup: npmjs.com → @brmbh/cli → Settings → Trusted publishing → GitHub Actions,
# repository brmbh/wordpress, workflow release.yml.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch (fixes) · minor (features) · major (breaking)
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  id-token: write # trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11 # trusted publishing needs npm >= 11.5.1

      - name: Bump version (package + core)
        id: v
        working-directory: packages/cli
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version > /dev/null
          VERSION=$(node -p 'require("./package.json").version')
          node -e 'const f="../../inc/core/core.json",fs=require("fs"),j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n")' "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm test
        working-directory: packages/cli

      - run: npm publish --access public
        working-directory: packages/cli

      - name: Commit, tag, release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin main "v$VERSION"
          gh release create "v$VERSION" --generate-notes --title "v$VERSION"
